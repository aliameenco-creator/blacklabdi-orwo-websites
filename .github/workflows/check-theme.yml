name: Check theme
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check PHP syntax
        run: |
          php --version
          find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Validate JSON and build installable theme
        run: |
          python3 -c "import json,pathlib; files=list(pathlib.Path('.').rglob('*.json')); [json.loads(p.read_text(encoding='utf-8-sig')) for p in files]; print('Validated',len(files),'JSON files')"
          python3 scripts/package.py
